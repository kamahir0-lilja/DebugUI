name: Package Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package layout and asset references
        run: python3 .github/scripts/validate_package.py

  unity-tests:
    needs: validate-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unity: [6000.3.12f1, 6000.6.4f1]
    steps:
      - uses: actions/checkout@v4
      - name: Create a Git consumer project and import the sample
        run: >-
          python3 .github/scripts/prepare_consumer.py
          --output .ci-consumer
          --unity-version "${{ matrix.unity }}"
          --snapshot-url file:///github/workspace/.ci-consumer/package.git
      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_SERIAL" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Configure UNITY_LICENSE or UNITY_SERIAL with UNITY_EMAIL and UNITY_PASSWORD for GameCI. See README.md."
            exit 1
          fi
      - name: Compile package and sample, and run regression tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .ci-consumer/Consumer
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          runAsHostUser: true
          coverageEnabled: false
          artifactsPath: artifacts/${{ matrix.unity }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-tests-${{ matrix.unity }}
          path: artifacts/${{ matrix.unity }}
